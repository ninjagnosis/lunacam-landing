# Share links keep their token.
location ~ ^/(?:ne/|en/)?share/(.+)$ { return 301 https://app.lunacam.app/share/$1; }

# Any other trailing slash: drop it (root excepted).
location ~ ^(/.+)/$ { return 301 https://lunacam.app$1$is_args$args; }

# Real 404 status for missing pages.
error_page 404 /404.html;
